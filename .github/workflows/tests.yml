name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify repository layout
        run: python tools/verify_repository.py
      - name: Check public file boundaries
        run: python tools/check_public_release.py
      - name: Compile
        run: python -m compileall -q app.py api dashboard database services sources tools tests
      - name: Test
        run: pytest -q
